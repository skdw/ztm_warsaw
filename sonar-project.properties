# SonarCloud CI-based analysis (see the coverage-signals job in .github/workflows/ci.yml).
# It requires "Automatic Analysis" to be switched off for this project (SonarCloud:
# Administration > Analysis Method). The two modes are mutually exclusive, and
# Automatic Analysis cannot read a coverage report at all.

sonar.projectKey=solarssk_ztm_warsaw
sonar.organization=recmedia

# The shipped integration is the analysed code; the tests are test code.
sonar.sources=custom_components/ztm_warsaw
sonar.tests=tests
# The integration must stay valid for Home Assistant 2024.4 (Python 3.12); CI runs 3.14.
sonar.python.version=3.12,3.13,3.14

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml
