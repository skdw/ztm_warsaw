name: Release

# A new version reaches users without a hand-made tag. When CI succeeds on main and the
# version in custom_components/ztm_warsaw/manifest.json has no tag yet, this workflow (called
# from the last job of ci.yml) tags that commit and creates the GitHub Release:
#   - a beta (X.Y.ZbN) is published at once as a pre-release;
#   - a stable version (X.Y.Z) is only a DRAFT: publishing it is a decision the maintainer takes
#     by hand. HACS offers an update only for a published Release.
#
# To release:
#   1. In one pull request, set "version" in custom_components/ztm_warsaw/manifest.json
#      and move the notes under a "## [X.Y.Z]" heading in CHANGELOG.md (a beta,
#      X.Y.ZbN, takes its notes from "## [Unreleased]"). Merge it.
#   2. CI runs on main; when every job has succeeded, the "Release" job of ci.yml calls this
#      workflow, which checks, and creates the Release only if all pass:
#        - the tag is "v" + the manifest.json version and CHANGELOG.md has real notes
#          for it (scripts/release_check.py, which also writes the notes);
#        - the commit is in the first-parent history of main (the merge commit, not a commit of
#          the merged branch) and the CI checks listed in scripts/release_preflight.py succeeded
#          on it in the push run of ci.yml on main (checks of its pull request do not count),
#          among them HACS validation, which is not required to merge.
#      The Release carries the integration as ztm_warsaw.zip and its Sigstore signature
#      bundle ztm_warsaw.zip.sigstore.json (keyless, signed by this workflow), so a
#      download can be verified with `cosign verify-blob`. HACS installs from the tag,
#      not from the zip: the zip is for people who want to check what they get.
#   3. A stable version: read the draft, then publish it.
#
# A version that already has a tag is skipped, so every later push to main is a no-op. Pushing a
# version tag by hand still works (the same checks, and the Release is created as before); a failed
# check is fixed with a new commit and a new version; do not move a tag that was already pushed.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
  workflow_call: {}

# Never cancel a release mid-flight (playbook docs/ci-cookbook.md #2b). One group per
# ref, with a name of its own: a called workflow's github.workflow is the caller's, and a group
# shared with ci.yml would cancel or block it. Runs of different tags are independent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags, to see whether this version has one

      - name: Work out the tag, and whether it already exists
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            version="$(python3 -c 'import json; print(json.load(open("custom_components/ztm_warsaw/manifest.json"))["version"])')"
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" != "tag" ]] && git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Create the release
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the Release
      checks: read # read the check runs of the commit
      actions: read # and the ci.yml runs they belong to
      id-token: write # keyless signing of the zip with Sigstore (no key is stored anywhere)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history of main, to see that the commit is on its first-parent line

      - name: Check the tag against manifest.json and CHANGELOG.md, and write the notes
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          NOTES_OUT: ${{ runner.temp }}/release-notes.md
        run: python3 scripts/release_check.py

      - name: Read the check runs of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | {id, name, status, conclusion, app: .app.slug, check_suite: .check_suite.id}' \
            > "${RUNNER_TEMP}/check-runs.jsonl"
          # Which of those check suites were the push run of ci.yml on main for this commit.
          gh api --paginate "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&per_page=100" \
            --jq '.workflow_runs[] | {id, check_suite_id, event, head_branch, head_sha}' \
            > "${RUNNER_TEMP}/workflow-runs.jsonl"

      - name: List the first-parent history of main
        run: git rev-list --first-parent origin/main > "${RUNNER_TEMP}/mainline.txt"

      - name: Require a mainline commit whose CI checks succeeded
        run: python3 scripts/release_preflight.py "${RUNNER_TEMP}/check-runs.jsonl" "${RUNNER_TEMP}/workflow-runs.jsonl" "${RUNNER_TEMP}/mainline.txt" "$GITHUB_SHA"

      - name: Pack the integration
        run: |
          set -euo pipefail
          cd custom_components/ztm_warsaw
          zip -qr -X "${RUNNER_TEMP}/ztm_warsaw.zip" . -x '__pycache__/*' '*.pyc'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the zip (keyless)
        run: cosign sign-blob --yes --bundle "${RUNNER_TEMP}/ztm_warsaw.zip.sigstore.json" "${RUNNER_TEMP}/ztm_warsaw.zip"

      - name: Create the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          ZIP: ${{ runner.temp }}/ztm_warsaw.zip
        run: |
          set -euo pipefail
          # A tag pushed by hand exists already; from main the Release creates it, on the commit that was checked.
          if [[ "$REF_TYPE" == "tag" ]]; then
            where=(--verify-tag)
          else
            where=(--target "$GITHUB_SHA")
          fi
          # A beta is published at once, as a pre-release; a stable version stays a draft for the maintainer to publish.
          if [[ "$TAG" == *b[0-9]* ]]; then
            gh release create "$TAG" "${where[@]}" --prerelease --title "$TAG" --notes-file "$NOTES_FILE" "$ZIP" "${ZIP}.sigstore.json"
          else
            gh release create "$TAG" "${where[@]}" --draft --title "$TAG" --notes-file "$NOTES_FILE" "$ZIP" "${ZIP}.sigstore.json"
          fi
