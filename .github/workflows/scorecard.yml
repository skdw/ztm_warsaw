name: OpenSSF Scorecard

# Report-only: it scores the repository's security practices (branch protection,
# pinned dependencies, token permissions, a security policy, CI tests, ...) and
# publishes the result to the public Scorecard API. Nothing depends on it and it is
# not a required check. Read it at
# https://api.securityscorecards.dev/projects/github.com/solarssk/ztm_warsaw
#
# Unlike ci.yml this workflow has a `schedule:`. GitHub disables a scheduled workflow
# after 60 days without repository activity; here that costs nothing, because a push
# to main and a change of the branch protection rule run it as well.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 4 * * 3"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # Scorecard reads the workflow files for its own checks
      id-token: write # sign and publish the result to the public Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
