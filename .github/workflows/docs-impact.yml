name: Documentation impact

# Kept out of ci.yml on purpose. The declaration lives in the pull request
# description, so this check has to run again when the description is edited
# (`edited`); a plain `pull_request` trigger only covers opened, synchronize and
# reopened, and would leave a corrected checkbox failing until the next push.
# ci.yml has no reason to rerun everything on a description edit.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# The group names the head commit as well as the pull request, so a run can only
# supersede another run for the same commit (two quick description edits: the later
# one carries the newer description). It must never cancel the run for a different
# commit: an `edited` event fired right after a push can still carry the previous
# head commit, and with one group per pull request that stale run cancelled the run
# for the new head, leaving the check cancelled on the commit that gets merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-impact:
    name: Documentation impact declaration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the declaration against the diff
        run: python3 scripts/check_pr_docs_impact.py
