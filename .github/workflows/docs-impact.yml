name: Documentation impact

# Kept out of ci.yml on purpose. The declaration lives in the pull request
# description, so this check has to run again when the description is edited
# (`edited`); a plain `pull_request` trigger only covers opened, synchronize and
# reopened, and would leave a corrected checkbox failing until the next push.
# ci.yml has no reason to rerun everything on a description edit.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One group per run: no run is ever cancelled or replaced by another. This check is
# required to merge, and a cancelled run of it on the head commit leaves the pull
# request blocked until someone repeats the run by hand. Two runs for one commit are
# normal here (a push, then a description edit a few seconds later), and with any
# shared group GitHub cancels one of them, in an order nobody controls: first one
# group per pull request let a stale run cancel the run for the new head, then one
# group per head commit let the later of two runs for the same commit end up
# cancelled. A run takes seconds and is idempotent, so letting every run finish costs
# nothing. GitHub judges the newest run of a check on the commit, which is the run
# for the newest description.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs-impact:
    name: Documentation impact declaration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the declaration against the diff
        run: python3 scripts/check_pr_docs_impact.py
