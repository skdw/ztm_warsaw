version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a freshly published version, so a compromised
    # release is more likely to have been caught and pulled first. Security
    # updates ignore the cooldown.
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      lint-and-audit-tools:
        patterns:
          - "ruff"
          - "mypy"
          - "pip-audit"
    ignore:
      # Moving the plugin moves Home Assistant and the minimum Python together, so
      # it is bumped by hand in the pull request that raises the CI Python version.
      - dependency-name: "pytest-homeassistant-custom-component"
