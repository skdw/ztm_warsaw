[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
# Production code must stay valid for the minimum supported Home Assistant
# (2026.1.0, Python 3.13), even if CI runs a newer Python.
target-version = "py313"

[tool.ruff.lint]
# The rules ruff applied by default before 0.16.0 (E4, E7, E9 and F), named
# explicitly so that a ruff upgrade cannot add rules to a pull request's CI.
# Widening this set, and fixing what it finds, is a separate change.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
# The project root, not the package: the XML report then carries paths relative to the
# repository ("custom_components/ztm_warsaw/client.py"), which SonarCloud and Codecov can
# match to files.
source = ["."]
branch = true
relative_files = true
omit = ["tests/*", "scripts/*", "_audit/*", ".claude/*", ".git/*", ".github/*", ".venv/*", "venv/*"]

[tool.coverage.report]
# `custom_components` is a namespace package (no __init__.py): search it, so that a production
# module no test imports still shows up in the report, at 0%.
include_namespace_packages = true
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Needed as soon as a test uses an async fixture such as `hass` from
# pytest-homeassistant-custom-component: pytest 9 rejects async fixtures in strict mode.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-ra -m 'not live' --strict-markers"
xfail_strict = true
timeout = 90  # a real asyncio.sleep under the frozen clock would hang forever: fail fast instead
markers = [
    "e2e: end-to-end scenario against the in-process fake city (real Home Assistant, real aiohttp traffic)",
    "start(when): start the frozen clock at this Warsaw wall-clock instant before Home Assistant is created",
    "city(**options): FakeCity constructor options for this test",
    "live: validates the REAL City of Warsaw API; needs ZTM_LIVE_API_KEY; never run in PR CI",
    "migrate: runs the real conversion of 1.1.x entries into lines at startup (the other e2e tests keep their 1.1.x entries as they are)",
    "compat: smoke test that must run on the oldest and the newest supported Home Assistant (tests/compat)",
]
